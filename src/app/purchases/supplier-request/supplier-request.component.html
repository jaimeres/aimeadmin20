<div style="position: absolute; z-index: 2;">
  <app-custom-button-crud (deleteAction)="delete()" (editAction)="edit()"
    (refreshAction)="getAll({ force: true, pos: pos() })" (newAction)="openNew({pos:pos()})"
    [moreOptions]="moreOptions()" [getMenu]="getMenu()" [openNewMenu]="openNewMenu()" [selected]="selected()"
    [startMenu]="startMenu()" (startAction)="setStatus($event)" />
</div>

<div class="table-fit-Custom">
  <app-custom-table class="table-fit-Custom" [value]="items()" [columns]="selectedColumns()" [selected]="selected()"
    (selectionAction)="onSelection($event)" (rowDoubleClick)="onRowDoubleClick($event)"
    [exportDialogVisible]="exportDialogVisible" [field]="fieldExport()"
    (exportDialogVisibleAction)="onExportDialogVisible($event)" (exportServerAction)="onExportServer($event)"
    (lazyLoadAction)="onLazyLoad({event:$event})" [rows]="limit()[pos()]" [totalRecords]="totalRecords()[pos()]"
    [filterDelayTable]="filterDelayTable()" />
</div>

<!-- [[[II ESC:031-06 DOC:docs/documents/2026-07-18-031-optimizacion-navegacion-activos.md#escenario-06 ESC:031-07 DOC:docs/documents/2026-07-18-031-optimizacion-navegacion-activos.md#escenario-07 -->
@defer (when localSettingsDialogVisible) {
<app-custom-local-settings *ngIf="showLocalSettingsComponent() && localSettingsDialogVisible"
  [sectionConfiguration]="localSettingsConfiguration()" [visible]="localSettingsDialogVisible" [field]="fieldConfig()"
  [formGroup]="configForm" (saveAction)="saveConfig()" (visibleAction)="onLocalSettingsDialogVisible($event)" />
}
<!-- ]]]FI -->

<app-custom-import [visible]="importDialogVisible" (visibleAction)="onImportDialogVisible($event)"
  (saveAction)="onImportSave($event)" />

<app-custom-actions-selection [visible]="actionsSelectionDialogVisible" (visibleChange)="onVisibleChange($event)" />

<p-dialog [(visible)]="formDialogVisible[$any(typeDefault)]" (onHide)="onHide($any(typeDefault))"
  (onShow)="onShow($any(typeDefault), $any(supplierRequestRef))" [styleClass]="styleClassDialog()" modal="true"
  [style]="{'contain': 'layout style paint'}" #supplierRequestRef [maximizable]="true">

  <ng-template #header>
    <div class="p-dialog-title">
      <span class="p-dialog-title-text">{{headerDialog()}}</span>
      <button type="button" class="p-dialog-titlebar-icon p-link" (click)="configDialog()">
        <i class="pi pi-spin pi-cog p-dialog-icon"></i>
      </button>
    </div>
  </ng-template>
  <form [formGroup]="form()[$any(typeDefault)]" *ngIf="form()[$any(typeDefault)]">
    <!-- [value]="tabVisible()"  -->
    <p-tabs [scrollable]="true" value="0" (valueChange)="onTabChange($event)">

      <p-tablist>
        <p-tab value="0">General</p-tab>
        <p-tab value="1">Clasificadores</p-tab>
        <p-tab value="2">Notas</p-tab>
        <p-tab value="3">Auditoría</p-tab>
        <p-tab value="4">Documentos</p-tab>
        <p-tab value="5">Documentos personales</p-tab>
      </p-tablist>

      <p-tabpanels>

        <p-tabpanel value="0">
          <!-- [[[II ESC:057-50 DOC:docs/documents/2026-08-08-057-propuesta-compras-v3.md#escenario-50
               `onSelectAutoCompleteAction`: elegir el documento ORIGEN jala sus
               partidas, y eso ocurre en esa salida. Sin enlazarla el componente
               EMITE y nadie escucha — el mismo defecto que la 036 corrigió para
               las otras tres, con el mismo síntoma: se selecciona y no pasa nada.
               ]]]FI -->
          <!-- [[[II ESC:036-08 DOC:docs/documents/2026-08-04-036-meta-sources-tabla-derivada.md#escenario-08
               Faltaban las tres salidas del formulario dinámico: sin ellas el
               componente EMITE y nadie escucha, así que el botón «Jalar partidas»
               se veía, registraba el clic y no hacía nada, y una fila de la tabla
               derivada tampoco podía guardarse. -->
          <!-- [[[II ESC:057-54 DOC:docs/documents/2026-08-08-057-propuesta-compras-v3.md#escenario-54
               Elegir el documento origen cambia el formulario sin dejar rastro.
               Esta tira es el rastro y la reversa: qué documentos entraron y
               cómo sacarlos sin borrar fila por fila. ]]]FI -->
          <app-custom-source-documents [documents]="conversionSourceDocuments()"
            (removeDocument)="removeConversionSourceDocument($event.field, $event.id)" />

          <app-custom-draw-form *ngIf="form()[$any(typeDefault)] && drawForm()[typeDefault]"
            [drawForm]="drawForm()[typeDefault]['general']" [formGroup]="form()[$any(typeDefault)]"
            [delegateTableSave]="true" (onTableRowSave)="handleTableRowSave($event)"
            [tableRowSaveOutcome]="tableRowSaveOutcome()" (onButtonClickAction)="handleButtonClick($event)"
            (onSelectAutoCompleteAction)="onSelectAutoComplete($event)" [isCreate]="isCreate()" />
          <!-- ]]]FI -->
        </p-tabpanel>

        <p-tabpanel header="Clasificadores" value="1">
          <div formArrayName="classifiers" class="pt-3">
            <div class="p-fluid grid separator-form-small pl-2"
              *ngFor="let level of classifierLevelsGen()[$any(pos())];  let i = index">
              <div class="field col-12 md:col-6">
                <span class="p-float-label">
                  <p-select styleClass="height-input-custom"
                    [options]="classifierTypeByLevel(level.classifier_type + 'p',level.level + 'p', i)" optionValue="id"
                    optionLabel="name" [formControlName]="funAuxFormClassifiers('formControlName',i)"
                    (onChange)="loadClassifiers($event, level, i)" placeholder="." [showClear]="true">
                  </p-select>
                  <label for="dropdown">{{level.name | slice:0:29}}</label>
                </span>
              </div>
            </div>
          </div>
        </p-tabpanel>

        <p-tabpanel value="3">
          <app-custom-audit [cf]="customField()[typeDefault]" [selected]="selected()" />
        </p-tabpanel>


      </p-tabpanels>
    </p-tabs>

  </form>

  <ng-template #footer>
    <div class="p-dialog-footer">
      <app-custom-button-footer (saveAction)="save({pos: typeDefault, is_file: true})"
        [config]="configGeneral()[$any(typeDefault)]"
        (saveNotHideAction)="save({pos: typeDefault, hide:false, is_file: true})"
        (resetFormAction)="resetFormDialog()" />
    </div>
  </ng-template>

</p-dialog>

<p-dialog [(visible)]="tempActionDialogVisible" (onHide)="tempActionDialogVisible=false" modal="true"
  [style]="{'contain': 'layout style paint'}">

  <ng-template #header>
    <div class="p-dialog-title">
      <span class="p-dialog-title-text">{{ tempActionLabel || 'Instalar materiales' }}</span>
    </div>
  </ng-template>

  <p-tabs [scrollable]="true" value="0">
    <p-tablist>
      <p-tab value="0">General</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="0">

        <p-table [value]="products" dataKey="id" selectionMode="multiple" [(selection)]="selectedProducts"
          [tableStyle]="{ 'min-width': '50rem' }">
          <ng-template #header>
            <tr>
              <th style="width: 4rem">
                <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
              </th>

              <th style="width:20%">
                Código
              </th>

              <th style="width:45%">
                Descripción
              </th>

              <th style="width:15%">
                Cantidad
              </th>

              <th style="width:10%">
                Evidencia
              </th>
            </tr>
          </ng-template>

          <ng-template #body let-product let-editing="editing">
            <tr>
              <td>
                <p-tableCheckbox [value]="product"></p-tableCheckbox>
              </td>

              <td>
                {{ product.code }}
              </td>

              <td>
                {{ product.name }}
              </td>

              <td [pEditableColumn]="product.quantity" pEditableColumnField="quantity">
                <p-cellEditor>
                  <ng-template #input>
                    <input pInputText type="number" [(ngModel)]="product.quantity" fluid />
                  </ng-template>
                  <ng-template #output>
                    {{ product.quantity }}
                  </ng-template>
                </p-cellEditor>
              </td>


              <td>
                <button type="button" pButton icon="pi pi-camera" class="height-icon-custom"
                  (click)="onCapturePhoto()"></button>
              </td>
            </tr>
          </ng-template>
        </p-table>

      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

</p-dialog>





<app-task-module-loader *ngIf="tasksModule()" [tasksModule]="tasksModule()" (closeDialog)="closeTaskModule()">
</app-task-module-loader>

<!-- [[[II ESC:057-157 DOC:docs/documents/2026-08-08-057-propuesta-compras-v3.md#escenario-157
  Esta pantalla no usa `app-crud-page-shell`, así que el diálogo de firma se
  incluye aquí. El estado vive en la clase CRUD, igual que en el shell.
-->
<app-custom-authorization [crud]="crudPage" />
<!-- ]]]FI -->
