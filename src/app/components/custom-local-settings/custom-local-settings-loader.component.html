@defer (when visible) {
  @if (visible) {
    <app-custom-local-settings-editor
      [visible]="visible"
      [field]="field"
      [formGroup]="formGroup"
      [sectionConfiguration]="sectionConfiguration"
      (saveAction)="saveAction.emit()"
      (visibleAction)="visibleAction.emit($event)"
    />
  }
} @loading (minimum 250ms) {
  <div class="local-settings-loading" role="status" aria-live="polite">
    <i class="pi pi-spin pi-spinner"></i>
    <span>Cargando configuración del módulo…</span>
  </div>
}
