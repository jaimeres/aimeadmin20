<p-dialog [(visible)]="visible" styleClass="width-650px-custom min-height-document-custom"
  header="Configuración del módulo" (onHide)="onHide($event)">

  <p-accordion [multiple]="true">

    <!-- ══ Panel 1: Columnas visibles ══ -->
    <p-accordion-panel header="Columnas visibles">
      <form [formGroup]="formGroup!" *ngIf="formGroup" class="pt-2">
        <p-multiSelect [options]="fieldSignal()?.cols || []" formControlName="columns" placeholder="Campos a mostrar"
          optionValue="field" optionLabel="header" selectedItemsLabel="{0} columnas seleccionadas" styleClass="w-full">
        </p-multiSelect>
      </form>
    </p-accordion-panel>

    <!-- ══ Panel 2: Filtros ══ -->
    <p-accordion-panel>

      <ng-template pTemplate="header">
        <div class="flex align-items-center gap-2">
          <span>Filtros</span>
          <p-tag *ngIf="activeFilterCount() > 0" [value]="activeFilterCount().toString()" severity="info">
          </p-tag>
        </div>
      </ng-template>

      <!-- Sin columnas -->
      <div *ngIf="filterableCols().length === 0" class="text-center text-color-secondary py-4">
        <i class="pi pi-table text-2xl mb-2"></i>
        <p class="text-sm">No hay columnas disponibles.</p>
      </div>

      <!-- ── Por columna ── -->
      <div *ngFor="let col of filterableCols(); let last = last"
        [class.filter-row-inactive]="!getRow(col.field).active">

        <!-- ─ Fila de cabecera ─ -->
        <div class="filter-row-header flex align-items-center gap-2 flex-wrap">

          <!-- Checkbox activo -->
          <p-checkbox [ngModel]="getRow(col.field).active" (ngModelChange)="toggleFilter(col.field, $event)"
            [binary]="true" pTooltip="Activar filtro" tooltipPosition="top">
          </p-checkbox>

          <!-- Etiqueta de columna -->
          <span class="font-semibold text-sm flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap"
            [title]="col.header">{{ col.header }}</span>

          <!-- Selector de operador — siempre visible -->
          <p-select [options]="getOpsOptions(col)" [ngModel]="getRow(col.field).op"
            (ngModelChange)="setOp(col.field, $event)" [disabled]="!getRow(col.field).active" optionLabel="label"
            optionValue="value" placeholder="Operador" styleClass="filter-op-select" appendTo="body">
          </p-select>

          <!-- Botón reset individual (solo cuando activo) -->
          <p-button *ngIf="getRow(col.field).active" icon="pi pi-times" severity="danger" [text]="true" size="small"
            pTooltip="Limpiar filtro" tooltipPosition="top" (onClick)="resetFilter(col.field)"
            styleClass="shrink-0 p-0">
          </p-button>

        </div><!-- /filter-row-header -->

        <!-- ─ Presets de fecha — siempre visibles para datetime ─ -->
        <div *ngIf="getColFilterType(col) === 'datetime'" class="pl-6 pt-1 pb-1 flex gap-1 flex-wrap">
          <p-button label="Hoy" severity="secondary" [outlined]="true" size="small"
            [disabled]="!getRow(col.field).active" (onClick)="applyRelativePreset(col.field, 'day')"></p-button>
          <p-button label="Semana" severity="secondary" [outlined]="true" size="small"
            [disabled]="!getRow(col.field).active" (onClick)="applyRelativePreset(col.field, 'week')"></p-button>
          <p-button label="Mes" severity="secondary" [outlined]="true" size="small"
            [disabled]="!getRow(col.field).active" (onClick)="applyRelativePreset(col.field, 'month')"></p-button>
          <p-button label="Año" severity="secondary" [outlined]="true" size="small"
            [disabled]="!getRow(col.field).active" (onClick)="applyRelativePreset(col.field, 'year')"></p-button>
        </div>

        <!-- ─ Aviso isnull ─ -->
        <div *ngIf="isNullOp(getRow(col.field).op)" class="pl-6 pb-1 pt-1 text-sm text-color-secondary">
          Filtra registros donde <strong>{{ col.header }}</strong> no tenga valor.
        </div>

        <!-- ─ Inputs de valor — SIEMPRE VISIBLES ─ -->
        <div *ngIf="!isNullOp(getRow(col.field).op)" class="pl-6 pt-1 pb-2">

          <!-- == RANGO == -->
          <ng-container *ngIf="isRangeOp(getRow(col.field).op)">
            <div class="flex gap-2 align-items-center flex-wrap">

              <ng-container [ngSwitch]="getColFilterType(col)">

                <!-- Numérico rango -->
                <p-inputNumber *ngSwitchCase="'numeric'" [formControl]="$any(getControl('fv_' + col.field))"
                  placeholder="Desde" styleClass="w-36" [useGrouping]="false" />
                <span *ngSwitchCase="'numeric'" class="text-color-secondary text-xs font-bold">→</span>
                <p-inputNumber *ngSwitchCase="'numeric'" [formControl]="$any(getControl('fv_' + col.field + '_2'))"
                  placeholder="Hasta" styleClass="w-36" [useGrouping]="false" />

                <!-- Fecha rango -->
                <p-datepicker *ngSwitchCase="'datetime'" [formControl]="$any(getControl('fv_' + col.field))"
                  appendTo="body" placeholder="Desde" styleClass="w-40" />
                <span *ngSwitchCase="'datetime'" class="text-color-secondary text-xs font-bold">→</span>
                <p-datepicker *ngSwitchCase="'datetime'" [formControl]="$any(getControl('fv_' + col.field + '_2'))"
                  appendTo="body" placeholder="Hasta" styleClass="w-40" />

              </ng-container>

            </div>
          </ng-container>

          <!-- == VALOR ÚNICO / EN LISTA == -->
          <ng-container *ngIf="!isRangeOp(getRow(col.field).op)">
            <ng-container [ngSwitch]="getColFilterType(col)">

              <!-- ── Texto: chips manuales (op=in) o input simple ── -->
              <ng-container *ngSwitchCase="'text'">
                <p-autoComplete *ngIf="isInOp(getRow(col.field).op)" [formControl]="$any(getControl('fv_' + col.field))"
                  [disabled]="!getRow(col.field).active" [multiple]="true" [typeahead]="false" [addOnBlur]="true"
                  [addOnTab]="true" placeholder="Escribir y presionar Enter..." styleClass="w-full" />
                <input *ngIf="!isInOp(getRow(col.field).op)" pInputText
                  [formControl]="$any(getControl('fv_' + col.field))" [disabled]="!getRow(col.field).active"
                  placeholder="Buscar..." class="w-full p-inputtext-sm" />
              </ng-container>

              <!-- ── Numérico ── -->
              <p-inputNumber *ngSwitchCase="'numeric'" [formControl]="$any(getControl('fv_' + col.field))"
                [disabled]="!getRow(col.field).active"
                [placeholder]="isInOp(getRow(col.field).op) ? 'Ej: 1, 5, 10' : 'Valor'" styleClass="w-full"
                [useGrouping]="false" />

              <!-- ── Fecha ── -->
              <p-datepicker *ngSwitchCase="'datetime'" [formControl]="$any(getControl('fv_' + col.field))"
                [disabled]="!getRow(col.field).active" appendTo="body" styleClass="w-full" />

              <!-- ── Booleano ── -->
              <p-select *ngSwitchCase="'boolean'" [formControl]="$any(getControl('fv_' + col.field))"
                [disabled]="!getRow(col.field).active" [options]="booleanOptions" optionLabel="name" optionValue="id"
                [showClear]="true" appendTo="body" styleClass="w-full" />

              <!-- ── FK / relación ── -->
              <ng-container *ngSwitchCase="'fk'">

                <!-- FK varios elementos (op = in): auto complete con búsqueda remota → chips -->
                <ng-container *ngIf="isInOp(getRow(col.field).op)">
                  <p-autoComplete [formControl]="$any(getControl('fv_' + col.field))"
                    [disabled]="!getRow(col.field).active" [multiple]="true" [suggestions]="getFkSuggestions(col.field)"
                    (completeMethod)="completeFkMethod($event, col)" [optionLabel]="getOptionLabel(col)" [minLength]="0"
                    [forceSelection]="true" [addOnBlur]="false" [addOnTab]="false"
                    placeholder="Escriba {{col.data_type ? 5 : 1}} caract. para buscar..." appendTo="body"
                    styleClass="w-full" />
                  <small *ngIf="getFkHint(col.field)" class="text-color-secondary text-xs pl-1">
                    <i class="pi pi-info-circle mr-1"></i>{{ getFkHint(col.field) }}
                  </small>
                </ng-container>

                <!-- FK único (op = exact u otro): auto complete single con búsqueda remota -->
                <ng-container *ngIf="!isInOp(getRow(col.field).op)">
                  <p-autoComplete [formControl]="$any(getControl('fv_' + col.field))"
                    [disabled]="!getRow(col.field).active" [multiple]="false"
                    [suggestions]="getFkSuggestions(col.field)" (completeMethod)="completeFkMethod($event, col)"
                    [optionLabel]="getOptionLabel(col)" [minLength]="0" [forceSelection]="true"
                    placeholder="Escriba {{col.data_type ? 5 : 1}} caract. para buscar..." appendTo="body"
                    styleClass="w-full" />
                  <small *ngIf="getFkHint(col.field)" class="text-color-secondary text-xs pl-1">
                    <i class="pi pi-info-circle mr-1"></i>{{ getFkHint(col.field) }}
                  </small>
                </ng-container>

              </ng-container>

            </ng-container>
          </ng-container>

        </div><!-- /value input -->

        <p-divider *ngIf="!last" styleClass="my-1"></p-divider>
      </div><!-- /forEach col -->

      <!-- ─ Acciones globales ─ -->
      <div *ngIf="filterableCols().length > 0"
        class="flex justify-content-between align-items-center mt-3 gap-2 flex-wrap">
        <p-button label="Limpiar filtros" icon="pi pi-filter-slash" severity="secondary" [outlined]="true" size="small"
          (onClick)="resetAllFilters()">
        </p-button>

        <!-- <small *ngIf="filterUrl()" class="text-color-secondary text-xs break-all filter-url-preview">
          {{ filterUrl() }}
        </small> -->
      </div>

    </p-accordion-panel>

  </p-accordion>

  <!-- Footer -->
  <ng-template #footer>
    <div class="flex justify-content-between w-full gap-2">
      <p-button label="Guardar (persistente)" icon="pi pi-cloud-upload" severity="secondary" [outlined]="true"
        (click)="onSavePersistent()" pTooltip="Guarda la configuración de filtros en el servidor para futuras sesiones"
        tooltipPosition="top">
      </p-button>
      <p-button label="Guardar" icon="pi pi-save" (click)="onSave()" styleClass="p-button-raised">
      </p-button>
    </div>
  </ng-template>

</p-dialog>
