<p-dialog [header]="header()" [visible]="visible()" (visibleChange)="visible.set($event)" [style]="{width: '350px'}" class="custom-login-dialog">
  <form class="flex flex-col items-center gap-6" [formGroup]="loginForm" (ngSubmit)="login()">
    <div class="w-full flex flex-col gap-4 pt-3">
      <!-- [[[II ESC:027-05 DOC:docs/documents/2026-07-01-027-autenticacion-segura-dispositivo-movil.md#escenario-05 -->
      @if (showBiometricOption()) {
        <button
          pButton
          pRipple
          type="button"
          class="w-full px-4 py-3 font-semibold p-button-outlined"
          label="Acceder con biometría"
          icon="pi pi-fingerprint"
          [loading]="biometricLoading()"
          (click)="loginWithBiometrics()">
        </button>
      }
      <!-- ]]]FI -->

      <p-icon-field>
        <p-inputicon class="pi pi-envelope" />
        <input pInputText
          class="w-full py-3 px-4 rounded-lg border border-surface-300 focus:border-primary outline-none transition"
          formControlName="username" placeholder="Usuario" />
      </p-icon-field>

      <!-- <p-icon-field>
        <p-inputicon class="pi pi-key" />
        <input pInputText type="password"
          class="w-full py-3 px-4 rounded-lg border border-surface-300 focus:border-primary outline-none transition"
          formControlName="password" placeholder="contraseña" />
      </p-icon-field> -->

      <p-icon-field>
        <p-inputicon class="pi pi-key" />
        <p-password formControlName="password" placeholder="contraseña" [toggleMask]="true" [feedback]="false"
          inputStyleClass="w-full" class="w-full" />
      </p-icon-field>

      <!-- [[[II ESC:027-05 DOC:docs/documents/2026-07-01-027-autenticacion-segura-dispositivo-movil.md#escenario-05 -->
      @if (showBiometricSetupOption()) {
        <div class="w-full flex items-start gap-2 text-left">
          <p-checkbox
            formControlName="setupBiometricAfterLogin"
            [binary]="true"
            inputId="dialog-setup-biometric"
            class="flex-none">
          </p-checkbox>
          <label for="dialog-setup-biometric" class="m-0 text-sm leading-tight">
            Activar registro biométrico en este equipo
          </label>
        </div>
      }
      <!-- ]]]FI -->

    </div>
    <button pButton pRipple type="submit" class="w-full mt-2 px-4 py-3 text-lg font-semibold" label="Iniciar sesión"
      [disabled]="loginForm.invalid"></button>

    <div class="w-full flex justify-end mt-2">
      <a class="text-sm text-primary cursor-pointer hover:underline" (click)="redirectMP()">¿Olvidó su
        contraseña?</a>
    </div>
  </form>
</p-dialog>
