<!-- [[[II ESC:015-01 DOC:docs/documents/2026-06-02_015_dynamic-table-field-component.md#escenario-01 -->
<ng-container *ngIf="tableConfig as config">
  <div *ngIf="config?.add_row || config?.delete_row" class="table-title-toolbar">
    <app-custom-button-crud [selected]="[]" (newAction)="addTableRow(config.field, config)" style="margin: 0px;">
    </app-custom-button-crud>
    <h5 *ngIf="config.label">{{ config.label }}</h5>
  </div>

  <p-table [value]="getTableData(config.field)" [sortMode]="config?.sort ? 'multiple' : 'single'"
    [globalFilterFields]="controlColumnFields" [showGridlines]="config?.show_grid_lines !== false"
    [stripedRows]="config?.striped_rows !== false" [responsiveLayout]="config?.responsive_layout || 'scroll'"
    [paginator]="config?.paginator || false" [rows]="tableOptions?.rows || 10"
    [resizableColumns]="config?.column_resizing !== false" columnResizeMode="expand"
    [selectionMode]="config?.selection_mode || null" (onRowSelect)="onRowSelect($event, config.field)"
    (onRowUnselect)="onRowUnselect($event, config.field)" styleClass="p-datatable-sm compact-table">

    <ng-template pTemplate="header">
      <tr>
        <th *ngIf="config?.row_number"
          style="width: 35px; min-width: 35px; position: sticky; left: 0; z-index: 1; background: var(--surface-ground); padding: 0.5rem 0.3rem;"
          class="border-right-1 border-300">#</th>
        <th *ngIf="config?.add_row || config?.delete_row"
          style="width: 75px; min-width: 75px; position: sticky; left: 35px; z-index: 1; background: var(--surface-ground); padding: 0.2rem 0.2rem !important;"
          class="border-right-1 border-300">Acciones</th>
        <th *ngFor="let col of normalizedColumns; trackBy: trackByColumnField"
          [style]="{'width': col._width || getColumnWidth(col)}"
          [pSortableColumn]="col.sortable !== false ? 'value.' + col.field : undefined">
          {{ col.header }}
          <p-sortIcon *ngIf="col.sortable !== false" [field]="'value.' + col.field"></p-sortIcon>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
      <tr [formGroup]="$any(rowData)">
        <ng-container *ngIf="getTableRowState(config.field, rowIndex) as rowEditState">
          <td *ngIf="config?.row_number"
            style="position: sticky; left: 0; z-index: 1; background: var(--surface-0); padding: 0.4rem 0.3rem; text-align: center; font-weight: 500;"
            class="border-right-1 border-300">
            {{ rowIndex + 1 }}
          </td>
          <td *ngIf="config?.add_row || config?.delete_row"
            style="position: sticky; left: 35px; z-index: 1; background: var(--surface-0); padding: 0.2rem 0.2rem !important;"
            class="border-right-1 border-300">
            <div class="flex gap-1 justify-content-center">
              <p-button *ngIf="!rowEditState.isRowOrCellEditing" icon="pi pi-pencil" size="small"
                severity="secondary" [text]="true" (onClick)="startRowEdit(config.field, rowIndex)"
                pTooltip="Editar fila" [style]="{'height': '28px', 'width': '28px'}">
              </p-button>
              <p-button *ngIf="rowEditState.isRowOrCellEditing" icon="pi pi-check" size="small" severity="success"
                [text]="true" (onClick)="finishRowEdit(config.field, rowIndex)" pTooltip="Guardar cambios"
                [style]="{'height': '28px', 'width': '28px'}">
              </p-button>
              <p-button *ngIf="rowEditState.isRowOrCellEditing" icon="pi pi-times" size="small" severity="danger"
                [text]="true" (onClick)="cancelRowEdit(config.field, rowIndex)" pTooltip="Cancelar edición"
                [style]="{'height': '28px', 'width': '28px'}">
              </p-button>
              <p-button *ngIf="config?.delete_row && !rowEditState.isRowOrCellEditing" icon="pi pi-trash"
                size="small" severity="danger" [text]="true" (onClick)="deleteTableRow(rowIndex, config.field)"
                pTooltip="Eliminar fila" [style]="{'height': '28px', 'width': '28px'}">
              </p-button>
            </div>
          </td>
          <td *ngFor="let col of normalizedColumns; trackBy: trackByColumnField"
            (dblclick)="!rowEditState.isRowEditing && !rowEditState.editingCells[col.field] && (col._editable !== undefined ? col._editable : isColumnEditable(col)) && startCellEdit(config.field, rowIndex, col.field)"
            [class.cursor-pointer]="!rowEditState.isRowEditing && !rowEditState.editingCells[col.field] && (col._editable !== undefined ? col._editable : isColumnEditable(col))">
            <div [ngSwitch]="col._type || getColumnType(col)">
              <div *ngSwitchCase="'input-text'">
                <span *ngIf="!rowEditState.isRowEditing && !rowEditState.editingCells[col.field]"
                  [class]="getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)">
                  <p-tag *ngIf="col.tag?.active; else plainText" [severity]="col._tagSeverity || getTagSeverity(col)"
                    [value]="formatTagValue(rowData.get(col.field)?.value, col)">
                  </p-tag>
                  <ng-template #plainText>
                    {{ formatTagValue(rowData.get(col.field)?.value, col) || '-' }}
                  </ng-template>
                </span>

                <input
                  *ngIf="rowEditState.isRowEditing && (col._editable !== undefined ? col._editable : isColumnEditable(col))"
                  type="text" pInputText [formControlName]="col.field"
                  [class]="'w-full ' + getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)"
                  [placeholder]="col.header" [maxlength]="col.validation?.max_length"
                  [minlength]="col.validation?.min_length" />

                <input *ngIf="rowEditState.editingCells[col.field]" type="text" pInputText
                  [formControlName]="col.field"
                  [class]="'w-full ' + getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)"
                  [placeholder]="col.header" [maxlength]="col.validation?.max_length"
                  [minlength]="col.validation?.min_length"
                  (keydown)="onCellKeydown($event, config.field, rowIndex, col.field)" [pAutoFocus]="true" />
              </div>

              <div *ngSwitchCase="'input-number'">
                <span *ngIf="!rowEditState.isRowEditing && !rowEditState.editingCells[col.field]"
                  [class]="getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)">
                  {{ rowData.get(col.field)?.value ?? '-' }}
                </span>

                <p-inputNumber
                  *ngIf="rowEditState.isRowEditing && (col._editable !== undefined ? col._editable : isColumnEditable(col))"
                  [formControlName]="col.field" [mode]="col.mode || 'decimal'" [min]="col.min" [max]="col.max"
                  [minFractionDigits]="col.min_fraction_digits" [maxFractionDigits]="col.max_fraction_digits"
                  class="w-full" />

                <p-inputNumber *ngIf="rowEditState.editingCells[col.field]" [formControlName]="col.field"
                  [mode]="col.mode || 'decimal'" [min]="col.min" [max]="col.max"
                  [minFractionDigits]="col.min_fraction_digits" [maxFractionDigits]="col.max_fraction_digits"
                  (onKeyDown)="onCellKeydown($event, config.field, rowIndex, col.field)" class="w-full"
                  [pAutoFocus]="true" />
              </div>

              <div *ngSwitchDefault>
                <span *ngIf="!rowEditState.isRowEditing && !rowEditState.editingCells[col.field]"
                  [class]="getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)">
                  {{ rowData.get(col.field)?.value || '-' }}
                </span>

                <input
                  *ngIf="rowEditState.isRowEditing && (col._editable !== undefined ? col._editable : isColumnEditable(col))"
                  type="text" pInputText [formControlName]="col.field"
                  [class]="'w-full ' + getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)"
                  [placeholder]="col.header" />

                <input *ngIf="rowEditState.editingCells[col.field]" type="text" pInputText
                  [formControlName]="col.field"
                  [class]="'w-full ' + getCellClass(rowData.get(col.field)?.value, col, config.field, rowIndex)"
                  [placeholder]="col.header" (keydown)="onCellKeydown($event, config.field, rowIndex, col.field)"
                  [pAutoFocus]="true" />
              </div>
            </div>
          </td>
        </ng-container>
      </tr>
    </ng-template>
  </p-table>
</ng-container>
<!-- ]]]FI -->
